name: Release

on:
  workflow_dispatch:
    inputs:
      version:
        description: "Version to release (e.g. 0.1.0)"
        required: true

jobs:
  release:
    runs-on: ubuntu-latest
    permissions:
      contents: write

    steps:
      - uses: actions/checkout@v4

      - name: Validate version matches pyproject.toml
        run: |
          PYPROJECT_VERSION=$(python3 -c "
          import re, pathlib
          text = pathlib.Path('pyproject.toml').read_text()
          print(re.search(r'version\s*=\s*\"([^\"]+)\"', text).group(1))
          ")
          if [ "$PYPROJECT_VERSION" != "${{ github.event.inputs.version }}" ]; then
            echo "::error::Version mismatch: pyproject.toml has $PYPROJECT_VERSION but release requested ${{ github.event.inputs.version }}"
            exit 1
          fi

      - name: Create tag and GitHub Release
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          TAG="v${{ github.event.inputs.version }}"
          # Idempotent tag push: if the tag already exists on the remote, skip
          # creation rather than failing. The 2026-03-21 run failed here when
          # someone re-triggered the workflow for an already-released version
          # ("Updates were rejected because the tag already exists in the remote").
          if git ls-remote --tags --exit-code origin "$TAG" >/dev/null 2>&1; then
            echo "::notice::Tag $TAG already exists on origin; skipping tag creation."
          else
            git tag "$TAG"
            git push origin "$TAG"
          fi
          # Same for the GitHub Release: only create if not already present.
          if gh release view "$TAG" >/dev/null 2>&1; then
            echo "::notice::Release $TAG already exists; skipping release creation."
          else
            gh release create "$TAG" \
              --title "$TAG" \
              --generate-notes
          fi
